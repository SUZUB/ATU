[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "atu2"
version = "0.0.1"
description = "ATU 2: cost-aware daily trend-following research platform (see docs/BUILD_PLAN.md)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "types-PyYAML",
    "pandas-stubs",
    "detect-secrets>=1.5",
    "pre-commit>=3.7",
]

[tool.setuptools.packages.find]
include = ["atu2*"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py311"
line-length = 120
# Legacy ATU 1 code is outside the ATU 2 build (CLAUDE.md rule 9) and is not linted.
extend-exclude = [
    "src",
    "archive",
    "notebooks",
    "*.ipynb",
    "alpaca_data.py",
    "constrained_trading_env.py",
    "market_data_processor.py",
    "orb_eval.py",
    "orb_model.py",
    "research_strategies.py",
    "sentiment_processor.py",
    "train_and_backtest.py",
    "tests/test_orb_v2.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PL", "D"]
ignore = [
    "D100", "D104",            # module/package docstrings are checked by the skeleton itself
    "D105", "D107",
    "D203", "D213",            # pick one docstring layout
    "D200", "D205", "D212", "D400", "D401", "D415",
    "PLR0911", "PLR0912", "PLR0913", "PLR2004",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR0915", "N802"]
"scripts/**" = ["D"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
files = ["atu2"]

# ---------------------------------------------------------------- pytest / coverage
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# The legacy ORB v2 test is slow (~5 min) and belongs to ATU 1; run it explicitly with
#   pytest tests/test_orb_v2.py -o addopts=""
addopts = "--ignore=tests/test_orb_v2.py --strict-markers"
markers = ["slow: real-data or multi-seed runs, run manually before a milestone gate"]

[tool.coverage.run]
source = ["atu2"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false
