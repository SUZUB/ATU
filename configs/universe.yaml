# ATU 2 universe (FR-03, ADR 0005). STATUS: proposed - awaiting confirmation before any backtest.
# The rule and the candidate list are fixed here BEFORE any backtest runs (risk R10).
# After the holdout is opened, changing this file is not allowed (change control).
#
# Inception dates are the funds' launch dates as known when this list was written; they are
# not verified yet. `atu2 data universe-check` re-checks them against the downloaded data.
status: proposed

rule:
  # Applied as of this fixed date (never "today"), so the list cannot drift.
  as_of: "2026-11-26"
  # Fund history needed (years between inception and as_of).
  min_history_years: 12.0
  # Median daily dollar volume (close x volume, raw prices) over the lookback, in USD.
  min_median_dollar_volume: 20000000.0
  volume_lookback_days: 252
  # An asset is tradable only after this many trading days of history (excluded until day 253).
  warm_up_days: 252
  # Every one of these classes must keep at least one asset.
  required_asset_classes:
    [us_equity, us_sector, intl_equity, govt_bond, credit, gold_silver, commodity, real_estate, currency]

